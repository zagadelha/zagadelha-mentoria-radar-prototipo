<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mentoria Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: app shell — quiet light rail + working canvas; brand forest reserved for entry & sales pages; green lives on the data (radar, progress), amber marks what needs attention now. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#EAF0E7; --line:#DAE3D6; --line-2:#C9D5C4;
  --ink:#122019; --ink-2:#47584D; --ink-3:#77887D;
  --forest:#0F3B24; --forest-2:#16502F; --on-forest:#E7F2EA; --on-forest-2:#9DBBA6;
  --leaf:#1C8746; --leaf-2:#14693A; --leaf-soft:#DCEFE2;
  --amber:#F2B705; --amber-ink:#3B2C00; --amber-soft:#FFF2C2;
  --bad:#C4432C; --bad-soft:#FADFD8; --warn:#A86F00; --warn-soft:#FFF0C8;
  --focus:#1C8746;
  --f-display:"Archivo","Noto Sans",system-ui,sans-serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --ease:cubic-bezier(.23,1,.32,1);
  --pop:0 1px 2px rgba(18,32,25,.06),0 12px 32px -12px rgba(18,32,25,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1410; --surface:#111C16; --surface-2:#16241C; --line:#22332A; --line-2:#2D4136;
  --ink:#E5EEE7; --ink-2:#A8B8AD; --ink-3:#7A8B80;
  --forest:#0A2618; --forest-2:#0F3221; --on-forest:#E7F2EA; --on-forest-2:#8DAA96;
  --leaf:#3DB96D; --leaf-2:#5ACB85; --leaf-soft:#173726;
  --amber:#F5C431; --amber-ink:#2B2000; --amber-soft:#3A2F0E;
  --bad:#EE7258; --bad-soft:#3A1B15; --warn:#E3A92F; --warn-soft:#382B10;
  --focus:#5ACB85; --pop:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1410; --surface:#111C16; --surface-2:#16241C; --line:#22332A; --line-2:#2D4136;
  --ink:#E5EEE7; --ink-2:#A8B8AD; --ink-3:#7A8B80;
  --forest:#0A2618; --forest-2:#0F3221; --on-forest:#E7F2EA; --on-forest-2:#8DAA96;
  --leaf:#3DB96D; --leaf-2:#5ACB85; --leaf-soft:#173726;
  --amber:#F5C431; --amber-ink:#2B2000; --amber-soft:#3A2F0E;
  --bad:#EE7258; --bad-soft:#3A1B15; --warn:#E3A92F; --warn-soft:#382B10;
  --focus:#5ACB85; --pop:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:15px;height:15px} .ico.l{width:22px;height:22px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--r-m);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .16s var(--ease),background .16s,border-color .16s,color .16s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--leaf);color:#fff}
.btn.primary:hover{background:var(--leaf-2)}
:root[data-theme="dark"] .btn.primary{color:#04140B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#04140B}}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.ghost{border:1px solid var(--line-2);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.quiet{color:var(--ink-2);padding:0 10px}
.btn.quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- app shell ---------- */
#app{min-height:100%}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 14px 16px;border-right:1px solid var(--line);background:var(--surface)}
.mark{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark b{font:800 15px/1.05 var(--f-display);font-stretch:118%;letter-spacing:.01em;display:block}
.mark small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:12px;color:var(--ink-3);padding:6px 10px 4px}
.nav button{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:650}
.nav button[aria-current="page"] .ico{color:var(--leaf)}
.nav .count{margin-left:auto;font-size:12px;color:var(--ink-3)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.demo-chip{font-size:12px;color:var(--ink-3);padding:8px 10px;border:1px dashed var(--line-2);border-radius:8px;line-height:1.4}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;text-align:left;width:100%}
.me:hover{background:var(--surface-2)}
.me .who{min-width:0;flex:1}
.me .who b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{display:block;font-size:12px;color:var(--ink-3)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;height:62px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:19px;font-weight:750;font-stretch:108%}
.topbar .crumb{color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:6px}
.topbar .spacer{flex:1}
.countdown{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--amber-soft);color:var(--ink);font-size:13px;font-weight:600}
.countdown i{width:7px;height:7px;border-radius:50%;background:var(--amber);font-style:normal}
.canvas{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%}
.m-head,.bnav{display:none}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.panel-h{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:16px 20px 0}
.panel-h h2{font-size:15.5px;font-weight:700;font-stretch:104%}
.panel-h .sub{font-size:13px;color:var(--ink-3)}
.panel-h .act{margin-left:auto}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr));border-top:0}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--surface-2)}
.lg.l1{background:color-mix(in oklab,var(--leaf) 25%,var(--surface-2))}.lg.l2{background:color-mix(in oklab,var(--leaf) 55%,var(--surface-2))}.lg.l3{background:var(--leaf)}
.sweep-m{transform-origin:0 0;animation:sweep 4s linear infinite}
.panel-b{padding:16px 20px 20px}
.grid{display:grid;gap:18px}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column}
.sep{height:1px;background:var(--line);margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf-2)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.amber{background:var(--amber-soft);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--leaf);transition:width .5s var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.kpi{padding:16px 20px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .k{font-size:12.5px;color:var(--ink-3)}
.kpi .v{font:750 26px/1.15 var(--f-display);font-stretch:112%;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:550;color:var(--ink-2);background:var(--surface);transition:all .15s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input{height:42px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);padding:0 12px;width:100%}
.input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
select.input{appearance:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer;transition:background .12s}
tbody tr.click:hover{background:var(--surface-2)}
.tbl{overflow-x:auto}

/* ---------- dashboard ---------- */
.mission{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding:24px}
.mission h2{font-size:28px;font-weight:800;font-stretch:115%;letter-spacing:-.01em;line-height:1.1}
.mission .lede{color:var(--ink-2);margin-top:8px;max-width:52ch}
.next{display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px;border-radius:var(--r-m);background:var(--surface-2)}
.next .t{min-width:0;flex:1}
.next .t b{display:block;font-weight:650}
.next .t span{font-size:13px;color:var(--ink-2)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:800 26px/1 var(--f-display);font-stretch:112%}
.ring .c small{font-size:12px;color:var(--ink-3);margin-top:4px}
.prova{padding:22px;display:flex;flex-direction:column;gap:14px;height:100%}
.prova .big{font:850 64px/0.9 var(--f-display);font-stretch:125%;letter-spacing:-.02em}
.prova .big small{font-size:18px;font-stretch:110%;font-weight:700;margin-left:6px;letter-spacing:0}
.streak{display:flex;gap:6px}
.streak span{flex:1;height:30px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;color:var(--ink-3);font-weight:600}
.streak span.on{background:var(--leaf-soft);color:var(--leaf-2)}
.streak span.today{outline:1.5px solid var(--leaf);outline-offset:-1.5px}
.radar-wrap{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px;align-items:center}
.radar svg{width:100%;height:auto;display:block;overflow:visible}
.radar .sweep{transform-origin:0 0;animation:sweep 6s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.legend-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.legend-row:last-child{border-bottom:0}
.legend-row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.legend-row b{font-variant-numeric:tabular-nums;font-weight:650}
.legend-row.weak span,.legend-row.weak b{color:var(--bad)}
.ia{padding:20px;display:flex;flex-direction:column;gap:12px}
.ia-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--leaf-2)}
.ia p{max-width:62ch}
.ia ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.heat .wd{font-size:11px;color:var(--ink-3);text-align:center}
.heat .d{height:34px;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--ink-3);max-width:100%}
.heat .d.l1{background:color-mix(in oklab,var(--leaf) 25%,var(--surface-2));color:var(--ink-2)}
.heat .d.l2{background:color-mix(in oklab,var(--leaf) 55%,var(--surface-2));color:var(--on-forest)}
.heat .d.l3{background:var(--leaf);color:#fff}
.heat .d.today{outline:1.5px solid var(--amber);outline-offset:-1.5px}
.heat .d.x{opacity:.35}
.rank-mini li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank-mini li:last-child{border-bottom:0}
.rank-mini .pos{width:24px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rank-mini .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-mini li.you{background:var(--amber-soft);margin:0 -10px;padding:8px 10px;border-radius:8px;border-bottom-color:transparent}
ul.clean{list-style:none;margin:0;padding:0}

/* ---------- cronograma ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{padding:12px 10px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,background .15s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .wd{font-size:12px;color:var(--ink-3);font-weight:600}
.day .dn{font:800 22px/1 var(--f-display);font-stretch:112%}
.day .mins{font-size:12px;color:var(--ink-2)}
.day .bar{height:5px}
.acts{display:flex;flex-direction:column;gap:12px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;padding:16px 18px;align-items:start}
.task .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;margin-top:2px;color:transparent;transition:all .2s var(--ease)}
.task.done .chk{background:var(--leaf);border-color:var(--leaf);color:#fff}
.task.done .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.task .kind{font-size:12px;font-weight:700;letter-spacing:.02em}
.kind.teoria{color:#2F6FB5} .kind.questoes{color:var(--leaf-2)} .kind.revisao{color:#9A5BC0} .kind.lei{color:var(--warn)}
.task .ttl{font-weight:650;font-size:15.5px;margin-top:2px}
.task .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.task .meta span{display:inline-flex;align-items:center;gap:5px}
.task .tip{margin-top:10px;font-size:13px;padding:9px 12px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.task .tip b{color:var(--ink)}
.task .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}

/* focus overlay */
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in oklab,var(--ink) 45%,transparent);display:grid;place-items:center;padding:20px;animation:fade .2s var(--ease)}
.focus-mode{position:fixed;inset:0;z-index:40;background:var(--forest);color:var(--on-forest);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;animation:fade .25s var(--ease)}
.focus-mode .lbl{color:var(--on-forest-2);font-size:14px}
.focus-mode h2{font-size:clamp(22px,3.4vw,34px);font-weight:800;font-stretch:115%;max-width:22ch}
.focus-mode .clock{font:800 clamp(64px,13vw,132px)/1 var(--f-display);font-stretch:125%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.focus-mode .row .btn.ghost{background:transparent;border-color:color-mix(in oklab,var(--on-forest) 35%,transparent);color:var(--on-forest)}
.focus-mode .goal{width:min(420px,100%)}
.focus-mode .goal .bar{background:color-mix(in oklab,var(--on-forest) 18%,transparent)}
.focus-mode .goal .bar>i{background:var(--amber)}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);background:var(--surface);border-radius:var(--r-l);box-shadow:var(--pop);padding:24px;display:flex;flex-direction:column;gap:16px;animation:pop .22s var(--ease);max-height:90vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal h3{font-size:19px;font-weight:750;font-stretch:108%}

/* ---------- questões ---------- */
.q-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.q-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-3);padding:16px 22px;border-bottom:1px solid var(--line)}
.q-meta b{color:var(--ink-2);font-weight:600}
.q-body{padding:22px}
.q-subj{font-size:12.5px;font-weight:700;color:var(--leaf-2);margin-bottom:8px}
.q-text{font-size:16px;line-height:1.65;max-width:72ch}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.alt{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:var(--r-m);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .15s,background .15s}
.alt:hover{border-color:var(--line-2);background:var(--surface-2)}
.alt .lt{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2);transition:all .15s}
.alt .tx{font-size:15px;line-height:1.5;padding-block:3px}
.alt .cut{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .15s}
.alt:hover .cut,.alt.elim .cut{opacity:1}
.alt .cut:hover{background:var(--surface);color:var(--ink)}
.alt.sel{border-color:var(--ink)}
.alt.sel .lt{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.alt.elim .tx{text-decoration:line-through;color:var(--ink-3)}
.alt.elim .lt{opacity:.4}
.alt.right{border-color:var(--leaf);background:var(--leaf-soft)}
.alt.right .lt{background:var(--leaf);border-color:var(--leaf);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.alt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.alt .pct{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right}
.q-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 22px;border-top:1px solid var(--line)}
.verdict{display:flex;align-items:center;gap:12px;padding:14px 22px;border-top:1px solid var(--line);font-weight:650}
.verdict.ok{background:var(--leaf-soft);color:var(--leaf-2)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{height:44px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab-b{padding:18px 22px 22px;max-width:76ch;line-height:1.65;color:var(--ink-2)}
.tab-b b{color:var(--ink)}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;border:1px solid var(--line-2);border-bottom-width:2px;font-size:11.5px;font-weight:650;color:var(--ink-2)}
.statline{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.statline:last-child{border-bottom:0}
.statline b{font:750 18px var(--f-display);font-stretch:110%;font-variant-numeric:tabular-nums}

/* ---------- simulados ---------- */
.sims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sim{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sim h3{font-size:16px;font-weight:700;font-stretch:104%;line-height:1.3}
.sim .meta{font-size:13px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}
.sim .foot{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.sim.feature{grid-column:1/-1;background:var(--forest);color:var(--on-forest);border-color:transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px}
.sim.feature .meta{color:var(--on-forest-2)}
.sim.feature h3{font-size:21px;font-stretch:115%;font-weight:800}
.run{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.sheet{padding:18px 20px;position:sticky;top:80px}
.bubbles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:12px}
.bub{display:flex;align-items:center;gap:6px;padding:4px;border-radius:8px;text-align:left}
.bub:hover{background:var(--surface-2)}
.bub.cur{background:var(--surface-2)}
.bub .n{width:20px;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bub .o{display:flex;gap:3px}
.bub .o i{width:15px;height:15px;border-radius:50%;border:1.3px solid var(--line-2);font-style:normal;font-size:8.5px;display:grid;place-items:center;color:var(--ink-3);font-weight:700}
.bub .o i.f{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.timer{font:800 22px/1 var(--f-display);font-stretch:115%;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:24px}
.score .big{font:850 72px/.9 var(--f-display);font-stretch:125%}
.score .big small{font-size:24px}
.review-q{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.review-q:last-child{border-bottom:0}

/* ---------- flashcards ---------- */
.decks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.deck{padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s,transform .16s var(--ease)}
.deck:hover{border-color:var(--line-2)}
.deck:active{transform:scale(.985)}
.deck h3{font-size:15.5px;font-weight:700;font-stretch:104%}
.deck .due{font:800 30px/1 var(--f-display);font-stretch:118%}
.deck .due small{font:500 13px var(--f-body);color:var(--ink-3);margin-left:4px}
.study{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card3d{perspective:1400px;height:330px;cursor:pointer}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .55s var(--ease);transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.card3d .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:14px;border:1px solid var(--line);background:var(--surface)}
.card3d .face.back{transform:rotateY(180deg);background:var(--forest);color:var(--on-forest);border-color:transparent}
.card3d .face .k{font-size:12.5px;font-weight:650;color:var(--ink-3)}
.card3d .face.back .k{color:var(--on-forest-2)}
.card3d .face p{font:700 clamp(19px,2.6vw,24px)/1.35 var(--f-display);font-stretch:104%}
.card3d .face.back p{font:500 17px/1.6 var(--f-body)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grade{padding:12px 8px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:650;transition:transform .16s var(--ease),border-color .15s}
.grade:active{transform:scale(.96)}
.grade small{font-size:12px;color:var(--ink-3);font-weight:500}
.grade.g1{color:var(--bad)} .grade.g4{color:var(--leaf-2)}
.grade:hover{border-color:var(--ink-3)}

/* ---------- ranking ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;padding:24px 20px 0}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .base{width:100%;border-radius:12px 12px 0 0;background:var(--surface-2);display:grid;place-items:center;font:850 30px var(--f-display);font-stretch:120%;color:var(--ink-3)}
.pod.p1 .base{height:118px;background:var(--amber-soft);color:var(--ink)}
.pod.p2 .base{height:86px}.pod.p3 .base{height:66px}
.pod .nm{font-weight:650;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pts{font-size:12.5px;color:var(--ink-3)}
.pod .av{width:46px;height:46px;font-size:15px}
tr.you td{background:var(--amber-soft)}

/* ---------- mentor ---------- */
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:var(--leaf-2)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 0 var(--leaf);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
.hours i{height:64px;border-radius:4px;background:var(--leaf)}
.hours-x{display:grid;grid-template-columns:repeat(4,1fr);font-size:11px;color:var(--ink-3);margin-top:6px}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.hbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.hbar .bar{height:10px}
.risk li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.risk li:last-child{border-bottom:0}
.risk .why{font-size:12.5px;color:var(--ink-2)}
.turmas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.turma{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.turma h3{font-size:15.5px;font-weight:700;font-stretch:104%;line-height:1.3}
.turma .days{font:850 34px/1 var(--f-display);font-stretch:120%}
.turma .days small{font:500 13px var(--f-body);color:var(--ink-3);margin-left:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(460px,100%);background:var(--surface);box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .28s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .db{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;padding:8px 0;font-size:13.5px;align-items:baseline}
.tl li i{width:8px;height:8px;border-radius:50%;background:var(--line-2);margin-top:5px}
.tl li.ok i{background:var(--leaf)}.tl li.bad i{background:var(--bad)}

/* ---------- entry pages ---------- */
.entry{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.entry .brand{background:var(--forest);color:var(--on-forest);padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden}
.entry .brand h1{font-size:clamp(34px,4.6vw,58px);font-weight:850;font-stretch:122%;line-height:.98;letter-spacing:-.015em;max-width:12ch}
.entry .brand p{color:var(--on-forest-2);max-width:42ch;font-size:16px}
.entry .bigradar{position:absolute;right:-150px;bottom:-170px;width:520px;opacity:.55;pointer-events:none;z-index:0}
.entry .brand>*:not(.bigradar){position:relative;z-index:1}
.entry .facts{display:flex;gap:30px;flex-wrap:wrap;margin-top:auto;position:relative}
.entry .facts b{display:block;font:850 28px var(--f-display);font-stretch:118%;color:var(--amber)}
.entry .facts span{font-size:13px;color:var(--on-forest-2)}
.entry .form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.entry .box{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.entry .box>.btn{width:100%}
.entry .box h2{font-size:26px;font-weight:800;font-stretch:112%}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-pick button{padding:14px;border-radius:var(--r-m);border:1px solid var(--line-2);text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--surface);transition:border-color .15s,transform .16s var(--ease)}
.demo-pick button:hover{border-color:var(--leaf)}
.demo-pick button:active{transform:scale(.98)}
.demo-pick b{font-weight:700}
.demo-pick span{font-size:12.5px;color:var(--ink-3)}

.sales{background:var(--forest);color:var(--on-forest);min-height:100vh}
.sales .in{max-width:1180px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.sales header .in{display:flex;align-items:center;gap:16px;height:72px}
.sales .hero{padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center}
.sales .hero h1{font-size:clamp(38px,5.6vw,72px);font-weight:850;font-stretch:124%;line-height:.96;letter-spacing:-.02em}
.sales .hero p{color:var(--on-forest-2);font-size:17px;max-width:46ch;margin-top:18px}
.sales .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-block:20px 64px}
.plan{background:var(--forest-2);border-radius:var(--r-l);padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid color-mix(in oklab,var(--on-forest) 12%,transparent)}
.plan.best{background:var(--on-forest);color:#0F3B24}
.plan .price{font:850 38px/1 var(--f-display);font-stretch:118%}
.plan .price small{font:500 14px var(--f-body);opacity:.7;margin-left:6px}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan .tag{font-size:12.5px;font-weight:700;color:var(--amber)}
.plan.best .tag{color:#7A5A00}
.plan .btn{margin-top:auto}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-block:48px;border-top:1px solid color-mix(in oklab,var(--on-forest) 14%,transparent)}
.feat h4{font-size:16px;font-weight:750;font-stretch:108%;margin-bottom:6px}
.feat p{color:var(--on-forest-2);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:550;font-size:14px;box-shadow:var(--pop);display:flex;align-items:center;gap:10px;animation:toast .3s var(--ease);max-width:calc(100% - 32px)}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
.shimmer{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:14px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis.six .kpi:nth-child(3n){border-right:0}
  .kpis.six .kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}
  .q-layout,.run{grid-template-columns:minmax(0,1fr)}
  .sheet{position:static}
  .turmas,.decks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span-4,.span-5,.span-7,.span-8{grid-column:span 12}
  .span-6{grid-column:span 6}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:none}
  .m-head{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .m-head h1{font-size:17px;font-weight:750;font-stretch:108%;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
  .bnav button[aria-current="page"]{color:var(--leaf-2)}
  .canvas{padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .span-6{grid-column:span 12}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .mission{grid-template-columns:minmax(0,1fr);padding:20px}
  .mission .ring{display:none}
  .mission h2{font-size:23px}
  .radar-wrap{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:repeat(7,minmax(64px,1fr));overflow-x:auto;padding-bottom:4px}
  .task{grid-template-columns:28px minmax(0,1fr)}
  .task .side{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap}
  .sims,.turmas,.decks{grid-template-columns:minmax(0,1fr)}
  .sim.feature{grid-template-columns:minmax(0,1fr)}
  .score{grid-template-columns:minmax(0,1fr)}
  .grades{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry{grid-template-columns:minmax(0,1fr)}
  .entry .brand{padding-block:32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-height:auto}
  .entry .bigradar{width:300px;right:-90px;bottom:-110px}
  .entry .facts{margin-top:8px}
  .sales .hero{grid-template-columns:minmax(0,1fr)}
  .sales .plans,.feat{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:110px minmax(0,1fr) 40px}
  .q-body,.q-meta,.q-foot,.verdict,.tab-b{padding-left:16px;padding-right:16px}
  .alt .cut{opacity:1}
  .podium{padding:18px 8px 0;gap:6px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function radarSVG(data,{size=300,showSweep=true,labels=true,compare=null}={}){
 const n=data.length,R=size/2-(labels?58:8),cx=0,cy=0;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
 const rings=[25,50,75,100].map(r=>`<polygon points="${data.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="${r===100?1.2:.8}"/>`).join('');
 const spokes=data.map((_,i)=>{const [x,y]=pt(i,100);return `<line x1="0" y1="0" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".8"/>`}).join('');
 const poly=data.map((d,i)=>pt(i,d.v).join(',')).join(' ');
 const cmp=compare?`<polygon points="${compare.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--ink-3)" stroke-dasharray="3 3" stroke-width="1.2"/>`:'';
 const weak=Math.min(...data.map(d=>d.v));
 const dots=data.map((d,i)=>{const [x,y]=pt(i,d.v);const w=d.v===weak;return `<circle cx="${x}" cy="${y}" r="${w?5:3.5}" fill="${w?'var(--bad)':'var(--leaf)'}" stroke="var(--surface)" stroke-width="2"/>`}).join('');
 const lbl=labels?data.map((d,i)=>{const [x,y]=pt(i,118);const anc=Math.abs(x)<8?'middle':x>0?'start':'end';return `<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" style="font:600 11.5px var(--f-body);fill:${d.v===weak?'var(--bad)':'var(--ink-2)'}">${esc(d.s)}</text><text x="${x}" y="${y+14}" text-anchor="${anc}" dominant-baseline="middle" style="font:700 11px var(--f-body);fill:var(--ink-3)">${d.v}%</text>`}).join(''):'';
 const sw=showSweep?`<g class="sweep"><path d="M0 0 L${0} ${-R} A${R} ${R} 0 0 1 ${R*Math.sin(Math.PI/5)} ${-R*Math.cos(Math.PI/5)} Z" fill="url(#swg)"/></g>`:'';
 const h=size/2;
 return `<svg viewBox="${-h} ${-h} ${size} ${size}" role="img" aria-label="Radar de acerto por disciplina">
  <defs><radialGradient id="swg" cx="0" cy="0" r="${R}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--amber)" stop-opacity="0"/><stop offset="1" stop-color="var(--amber)" stop-opacity=".22"/></radialGradient></defs>
  ${rings}${spokes}${sw}${cmp}
  <polygon points="${poly}" fill="var(--leaf)" fill-opacity=".16" stroke="var(--leaf)" stroke-width="2" stroke-linejoin="round"/>
  ${dots}${lbl}</svg>`;
}
function ringSVG(v,max){const r=56,c=2*Math.PI*r,p=Math.min(1,v/max);return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="11"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--leaf)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" style="transition:stroke-dashoffset .6s var(--ease)"/></svg>`;}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
function areaChart(vals,{w=640,h=300,labels=[]}={}){
 const max=Math.ceil(Math.max(...vals)/100)*100,pl=36,pb=24,pt=10,iw=w-pl-8,ih=h-pb-pt;
 const x=i=>pl+i*iw/(vals.length-1),y=v=>pt+ih-v/max*ih;
 const line=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
 const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${w-8}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(max*f)+4}" text-anchor="end">${fmt(max*f)}</text>`).join('');
 const xl=labels.map(([i,t],k)=>`<text x="${x(i)}" y="${h-6}" text-anchor="${k===labels.length-1?'end':k===0?'start':'middle'}">${t}</text>`).join('');
 const last=vals.length-1;
 return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Questões resolvidas por dia">${grid}
  <path d="${line} L${x(last)} ${y(0)} L${x(0)} ${y(0)} Z" fill="var(--leaf)" fill-opacity=".12"/>
  <path d="${line}" fill="none" stroke="var(--leaf)" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="${x(last)}" cy="${y(vals[last])}" r="4.5" fill="var(--leaf)" stroke="var(--surface)" stroke-width="2"/>
  <text x="${x(last)-8}" y="${y(vals[last])-10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmt(vals[last])} hoje</text>${xl}</svg>`;
}

let focusT,simT;
const A={
 as(el){S.role=el.dataset.role;S.menu=false;S.drawer=null;go(S.role==='aluno'?'inicio':'painel');toast(S.role==='aluno'?'Você entrou como Ana Beatriz (aluna)':'Você entrou como Prof. Carlos (mentor)');},

 menu(){S.menu=true;renderLayer();},
 close(){S.menu=false;S.confirm=null;S.iaModal=null;S.drawer=null;renderLayer();},
 logout(){S.role=null;S.menu=false;S.view='login';clearInterval(focusT);clearInterval(simT);S.focus=null;render();renderLayer();},
 planos(){S.role=null;S.menu=false;S.view='planos';render();renderLayer();window.scrollTo({top:0});},
 toast(el){toast(el.dataset.msg);},
 day(el){S.day=+el.dataset.d;render();},
 toggle(el){const a=S.acts[S.day].find(x=>x.id===el.dataset.id);a.done=!a.done;render();if(a.done)toast(`Atividade concluída · +${a.min} min`);},
 focus(el){const a=S.acts[21].find(x=>x.id===el.dataset.id);S.focus={act:a,sec:0,paused:false};renderLayer();
  clearInterval(focusT);focusT=setInterval(()=>{if(!S.focus||S.focus.paused)return;S.focus.sec++;const c=document.getElementById('fclock');if(c)c.textContent=clk(S.focus.sec);const b=document.getElementById('fbar');if(b)b.style.width=Math.min(100,S.focus.sec/60/S.focus.act.min*100)+'%';},1000);},
 fpause(){S.focus.paused=!S.focus.paused;renderLayer();},
 fdone(){const a=S.focus.act;a.done=true;S.focus=null;clearInterval(focusT);renderLayer();render();toast(`“${a.ttl.split(':')[0]}” concluída · +${a.min} min no dia`);},
 fexit(){S.focus=null;clearInterval(focusT);renderLayer();},
 treino(){S.q.disc='Todas';S.q.list=[1,0,2,3,4,5];resetQ();go('questoes');toast('Treino montado: Raciocínio Lógico primeiro');},
 qdisc(el){const d=el.dataset.d;S.q.disc=d;S.q.list=d==='Todas'?Q.map((_,i)=>i):Q.map((q,i)=>q.disc===d?i:-1).filter(i=>i>=0);resetQ();render();},
 qsel(el,ev){if(S.q.answered)return;if(ev.target.closest('.cut'))return;const i=+el.dataset.i;if(S.q.elim[i])delete S.q.elim[i];S.q.sel=i;render();},
 qcut(el){const i=+el.dataset.i;S.q.elim[i]=!S.q.elim[i];if(S.q.sel===i)S.q.sel=null;render();},
 qans(){if(S.q.sel==null)return;S.q.answered=true;S.q.done++;if(S.q.sel===curQ().ok)S.q.ok++;S.q.tab='com';render();},
 qnext(){S.q.idx=(S.q.idx+1)%S.q.list.length;S.q.sel=null;S.q.elim={};S.q.answered=false;render();},
 qtab(el){S.q.tab=el.dataset.t;render();},
 simstart(el){startSim(el.dataset.id);clearInterval(simT);simT=setInterval(()=>{if(!S.sim){clearInterval(simT);return}S.sim.left--;const c=document.getElementById('simclock');if(c){c.textContent=clk(S.sim.left);c.classList.toggle('low',S.sim.left<120)}if(S.sim.left<=0)finishSim();},1000);},
 simsel(el){S.sim.ans[S.sim.cur]=+el.dataset.i;render();},
 simnav(el){S.sim.cur=Math.max(0,Math.min(Q.length-1,S.sim.cur+ +el.dataset.d));render();},
 simgo(el){S.sim.cur=+el.dataset.n;render();},
 simend(){const n=Object.keys(S.sim.ans).length;S.confirm={t:'Finalizar o simulado?',d:n<Q.length?`Você respondeu ${n} de ${Q.length} questões. As que ficarem em branco contam como erro no ranking.`:'Você respondeu todas as questões. O gabarito comentado aparece em seguida.',yes:'Finalizar e ver resultado',no:'Continuar respondendo',act:'simfinish'};renderLayer();},
 simfinish(){finishSim();renderLayer();},
 'simres-old'(){S.simRes={ok:4,bl:0,err:2,used:640,per:{'Língua Portuguesa':{t:1,o:1},'Raciocínio Lógico':{t:1,o:0},'Direito Constitucional':{t:1,o:1},'Noções de Informática':{t:1,o:1},'Direito Administrativo':{t:1,o:0},'Legislação do SUS':{t:1,o:1}},ans:{0:2,1:0,2:0,3:1,4:1,5:0},t:'2º Simulado — Técnico Administrativo SESAU/RO'};go('simRes');},
 fcstart(el){S.fc={deck:el.dataset.d,i:0,flip:false,res:[]};go('fcStudy');},
 fcflip(){S.fc.flip=!S.fc.flip;render();},
 fcgrade(el){S.fc.res.push(+el.dataset.g);S.fc.i++;S.fc.flip=false;render();},
 ia(){S.iaModal={step:0};renderLayer();},
 iagen(){S.iaModal={step:1};renderLayer();setTimeout(()=>{if(S.iaModal){S.iaModal.step=2;renderLayer();}},1400);},
 iasave(){S.iaModal=null;renderLayer();toast('24 flashcards adicionados em Legislação do SUS');},
 rtab(el){S.rankTab=el.dataset.t;render();},

 nudge(el){toast(`Lembrete enviado para ${el.dataset.n.split(' ')[0]} (demonstração)`);if(S.drawer!=null){S.drawer=null;renderLayer();}},
 ast(el){S.alunosSt=el.dataset.s;render();},
 openaluno(el){S.drawer=+el.dataset.i;renderLayer();},
 openturma(el){S.alunosT=el.dataset.t;S.alunosSt='todos';S.alunosQ='';go('alunos');},
};
function resetQ(){Object.assign(S.q,{idx:0,sel:null,elim:{},answered:false,tab:'com'});}

document.addEventListener('click',ev=>{
 const a=ev.target.closest('[data-act],[data-go]');
 if(!a)return;
 if(a.classList.contains('overlay')&&ev.target!==a)return;
 if(a.dataset.go&&!a.dataset.act){go(a.dataset.go);return;}
 const f=A[a.dataset.act];if(f){if(a.tagName==='A')ev.preventDefault();f(a,ev);}
});
document.addEventListener('submit',ev=>{if(ev.target.id==='loginForm'){ev.preventDefault();A.as({dataset:{role:'aluno'}});}});
document.addEventListener('input',ev=>{
 if(ev.target.id==='asearch'){S.alunosQ=ev.target.value;const pos=ev.target.selectionStart;render();const i=document.getElementById('asearch');if(i){i.focus();i.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',ev=>{if(ev.target.id==='aturma'){S.alunosT=ev.target.value;render();}});
document.addEventListener('keydown',ev=>{
 const tag=(ev.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
 if(ev.key==='Escape'&&(S.menu||S.confirm||S.iaModal||S.drawer!=null)){A.close();return;}
 if(S.view==='questoes'&&S.role){const q=curQ();const k=ev.key.toLowerCase();
  if(!S.q.answered){const idx=q.tipo==='ce'?{c:0,e:1}[k]:'abcde'.indexOf(k);if(idx!=null&&idx>=0&&idx<q.alts.length){S.q.sel=idx;delete S.q.elim[idx];render();return;}
   if(k==='x'&&S.q.sel!=null){S.q.elim[S.q.sel]=true;S.q.sel=null;render();return;}}
  if(ev.key==='Enter'){S.q.answered?A.qnext():A.qans();return;}}
 if(S.view==='fcStudy'&&ev.key===' '){ev.preventDefault();A.fcflip();return;}
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[role="radio"],[role="button"]')){ev.preventDefault();ev.target.click();}
});
function bindAfter(){}
render();
</script>
</body>
</html>
